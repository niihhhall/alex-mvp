<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="Alex: AI code review that explains itself">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#0F1A30"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34D399"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.1" r="0.6">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1A2540" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1280" height="320" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="320" rx="24" fill="url(#grid)" opacity="0.55"/>
  <rect width="1280" height="320" rx="24" fill="url(#glow)"/>

  <g transform="translate(88 80) scale(0.3125)">
    <rect width="512" height="512" rx="112" fill="#0B1220" stroke="#1F2A44" stroke-width="8"/>
    <path d="M256 104 L384 400 H330 L301 330 H211 L182 400 H128 Z M229 284 H283 L256 214 Z" fill-rule="evenodd" fill="url(#mark)"/>
    <path d="M186 300 L236 346 L330 236" fill="none" stroke="#0B1220" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M186 300 L236 346 L330 236" fill="none" stroke="#F8FAFC" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="288" y="150" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="72" font-weight="700" fill="#F8FAFC" letter-spacing="-1.5">Alex</text>
  <text x="290" y="200" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="28" fill="#94A3B8">AI code review that explains itself.</text>

  <g font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="600">
    <rect x="290" y="232" width="150" height="34" rx="17" fill="#13203A" stroke="#24345A"/>
    <text x="365" y="255" text-anchor="middle" fill="#CBD5E1">Confidence score</text>
    <rect x="452" y="232" width="128" height="34" rx="17" fill="#13203A" stroke="#24345A"/>
    <text x="516" y="255" text-anchor="middle" fill="#CBD5E1">Diagrams</text>
    <rect x="592" y="232" width="150" height="34" rx="17" fill="#13203A" stroke="#24345A"/>
    <text x="667" y="255" text-anchor="middle" fill="#CBD5E1">One-click fixes</text>
    <rect x="754" y="232" width="176" height="34" rx="17" fill="#13203A" stroke="#24345A"/>
    <text x="842" y="255" text-anchor="middle" fill="#CBD5E1">Never runs PR code</text>
  </g>

  <!-- mini card -->
  <g transform="translate(948 60)">
    <rect width="264" height="200" rx="16" fill="#0E1729" stroke="#24345A"/>
    <text x="20" y="38" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#F8FAFC">Alex review</text>
    <g transform="translate(150 26)">
      <circle cx="0" cy="6" r="6" fill="#34D399"/><circle cx="18" cy="6" r="6" fill="#34D399"/>
      <circle cx="36" cy="6" r="6" fill="#34D399"/><circle cx="54" cy="6" r="6" fill="#34D399"/>
      <circle cx="72" cy="6" r="6" fill="none" stroke="#475569" stroke-width="2"/>
    </g>
    <rect x="20" y="58" width="224" height="1" fill="#24345A"/>
    <g font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
      <rect x="20" y="74" width="34" height="20" rx="6" fill="#7C2D12"/><text x="37" y="88" text-anchor="middle" fill="#FDBA74" font-weight="700">P1</text>
      <text x="64" y="88" fill="#E2E8F0">Replies stop for every user</text>
      <rect x="20" y="106" width="34" height="20" rx="6" fill="#713F12"/><text x="37" y="120" text-anchor="middle" fill="#FDE68A" font-weight="700">P2</text>
      <text x="64" y="120" fill="#E2E8F0">Unclear retry naming</text>
    </g>
    <g stroke="#22D3EE" stroke-width="2" fill="none">
      <rect x="20" y="146" width="56" height="30" rx="6"/><rect x="104" y="146" width="56" height="30" rx="6"/>
      <rect x="188" y="146" width="56" height="30" rx="6" stroke="#F87171"/>
      <path d="M76 161H104M160 161H188"/>
    </g>
  </g>
</svg>
